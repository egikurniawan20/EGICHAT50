name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "EGICHAT-APK-v2.zip"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon
        working-directory: EGICHAT-APK
      - uses: actions/upload-artifact@v4
        with:
          name: EGICHAT-APK
          path: EGICHAT-APK/app/build/outputs/apk/release/app-release.apk

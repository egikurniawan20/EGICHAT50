
name: Build EGI CHAT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Buat proyek Android
        run: |
          cordova create app com.egichat.app "EGI CHAT"
          cp EGICHAT_CALL_HEADER_DIPERBAIKI.html app/www/index.html

      - name: Konfigurasi Android
        run: |
          cd app
          cordova platform add android@13
          cordova build android --debug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: EGI-CHAT-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
